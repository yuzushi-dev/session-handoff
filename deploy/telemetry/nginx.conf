events {}

http {
  access_log off;
  log_format disabled '$remote_addr';
  client_max_body_size 1m;
  client_body_timeout 5s;
  send_timeout 5s;
  upstream collector { server collector:4318; }
  upstream grafana { server grafana:3000; }

  server {
    listen 4318;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    location = /v1/logs {
      proxy_pass http://collector/v1/logs;
      proxy_http_version 1.1;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }
  }

  server {
    listen 3000;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    location / {
      proxy_pass http://grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
