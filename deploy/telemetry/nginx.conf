events {}

http {
  access_log off;
  log_format disabled '$remote_addr';
  client_max_body_size 1m;
  client_body_timeout 5s;
  send_timeout 5s;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_status 429;

  # Behind the Cloudflare Tunnel, $remote_addr is cloudflared's container IP for
  # every request -- key on the real visitor IP Cloudflare forwards instead, so
  # the limit is per-visitor, not one shared bucket for all public traffic.
  map $http_cf_connecting_ip $telemetry_limit_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
  }
  limit_req_zone $telemetry_limit_key zone=telemetry_ingest:10m rate=30r/m;

  server {
    listen 4318;
    location = /v1/logs {
      limit_req zone=telemetry_ingest burst=10 nodelay;
      set $collector_upstream http://collector:4318;
      proxy_pass $collector_upstream/v1/logs;
      proxy_http_version 1.1;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }
  }

  server {
    listen 3000;
    location / {
      set $grafana_upstream http://grafana:3000;
      proxy_pass $grafana_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
