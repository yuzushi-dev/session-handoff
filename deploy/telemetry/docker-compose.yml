services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.130.0@sha256:867d1074c2f750936fb9358ec9eefa009308053cf156b2c7ca1761ba5ef78452
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    expose: ["4318"]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]

  loki:
    image: grafana/loki:3.5.0@sha256:4c431d2e6b9b38718694b31c5d56be7c80dc69c513215fde1aeb5b02cd4e2665
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    expose: ["3100"]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]

  grafana:
    image: grafana/grafana:12.0.0@sha256:263cbefd5d9b179893c47c415daab4da5c1f3d6770154741eca4f45c81119884
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard-session-handoff.json:/var/lib/grafana/dashboards/session-handoff.json:ro
      - ./grafana-dashboard-sando.json:/var/lib/grafana/dashboards/sando.json:ro
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/telemetry.yaml:ro
      - ./grafana-dashboard-providers.yaml:/etc/grafana/provisioning/dashboards/telemetry.yaml:ro
    expose: ["3000"]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]

  gateway:
    image: nginx:1.29.0@sha256:3ab4ed065a1437cbbd45e65617b1285bdf6523c6bf56a121e00df41720e09a89
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13000:3000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx
      - /var/run
    depends_on: [collector, grafana]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2@sha256:0d4dd1e618b7f0aee44c85252c31b2b8964f4bf5872ae4e46f0e6d1ad2b0b57e
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    profiles: ["public"]
    depends_on: [gateway]
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]

volumes:
  loki-data:
  grafana-data:
