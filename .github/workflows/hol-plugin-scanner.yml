name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HOL Plugin Scanner
        id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@588d157fed6e47942a2ca3c9251ff7bff4a48bc9 # v1.2.667
        with:
          plugin_dir: "."
          config: .plugin-scanner.toml
          mode: scan
          min_score: 80
          fail_on_severity: high

      - name: Check README score badge
        env:
          SCANNER_SCORE: ${{ steps.scan.outputs.score }}
        run: |
          test -n "$SCANNER_SCORE"
          grep -F "HOL%20Guard%20Score-${SCANNER_SCORE}%2F100-" README.md
